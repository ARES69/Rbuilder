# Builds the RBuilder desktop app on every v* tag and attaches the MSI and
# NSIS installers to a GitHub Release.
#
# The build mirrors scripts/build-desktop.ps1:
#   front end -> server bundle -> Bun-compiled sidecar -> tauri build.
name: desktop-release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "server/**"
      - "src-tauri/**"
      - "tests/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust (stable, MSVC)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend and server dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build the front end
        run: pnpm exec vite build

      - name: Build the server bundle
        run: pnpm exec vite build --config vite.config.server.ts

      - name: Compile the sidecar with Bun
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          pnpm exec bun build dist-server/index.js --compile --outfile .freebuff-build/rbuilder-server.exe

      - name: Build the Tauri shell (MSI + NSIS)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: pnpm exec tauri build

      - name: Collect installers
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        id: collect
        shell: pwsh
        run: |
          $msi = Get-ChildItem src-tauri\target\release\bundle\msi\*.msi | Select-Object -First 1
          $nsis = Get-ChildItem src-tauri\target\release\bundle\nsis\*-setup.exe | Select-Object -First 1
          "msi=$($msi.FullName)" >> $env:GITHUB_OUTPUT
          "nsis=$($nsis.FullName)" >> $env:GITHUB_OUTPUT

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            ${{ steps.collect.outputs.msi }}
            ${{ steps.collect.outputs.nsis }}
          if-no-files-found: error

      - name: Attach installers to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.collect.outputs.msi }}
            ${{ steps.collect.outputs.nsis }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
