# Build RBuilder Desktop installers: MSI + NSIS on Windows, .app/.dmg on macOS.
#
# Triggers:
#   - manually from the Actions tab (workflow_dispatch)
#   - pushing a tag like v0.1.0 (also publishes a GitHub Release)
#
# Frontend URL note: the desktop build bakes VITE_CONVEX_URL into the bundle.
# CI uses the repository secret VITE_CONVEX_URL when present; otherwise a
# placeholder is compiled in so the build still succeeds (the app will show
# a connection error until rebuilt with the real deployment URL).
#
# Windows runners ship with MSVC preinstalled; Tauri downloads WiX (MSI) and
# NSIS automatically. macOS builds are universal (Apple Silicon + Intel).

name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # required for creating the GitHub Release on tag push

jobs:
  web-checks:
    name: TypeScript + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: TypeScript check
        run: bunx tsc -b --noEmit

      - name: Unit tests
        run: bun test

  desktop:
    name: ${{ matrix.label }}
    needs: web-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (MSI + NSIS)
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            label: macOS (universal .app + .dmg)
            target: universal-apple-darwin

    runs-on: ${{ matrix.os }}
    env:
      VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || 'https://placeholder.convex.cloud' }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Regenerate Convex type bindings so the build never depends on stale
      # committed bindings or runner caches.
      - name: Generate Convex bindings
        run: bunx convex codegen --typecheck=disable

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Never empty: an empty value would make the action skip `rustup
          # target add` entirely, so each runner lists its own target.
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri.conf.json has no beforeBuildCommand, so the web bundle must be
      # built explicitly before tauri build (frontendDist: ../dist).
      - name: Web build (vite)
        run: bun run build

      - name: Build installers (macOS universal)
        if: matrix.target == 'universal-apple-darwin'
        run: bunx tauri build --target universal-apple-darwin

      - name: Build installers (Windows)
        if: matrix.target != 'universal-apple-darwin'
        run: bunx tauri build

      - name: Upload artifacts (Windows)
        if: matrix.target != 'universal-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          # `**` covers both layouts: target/release/bundle and the
          # target-triple folder Tauri uses on some setups.
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload artifacts (macOS)
        if: matrix.target == 'universal-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          generate_release_notes: true
