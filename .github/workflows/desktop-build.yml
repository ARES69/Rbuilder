# Build RBuilder Desktop installers: MSI + NSIS on Windows, .app/.dmg on macOS.
#
# Triggers:
#   - manually from the Actions tab (workflow_dispatch)
#   - pushing a tag like v0.1.0 (also publishes a GitHub Release)
#
# Frontend URL note: the desktop build bakes VITE_CONVEX_URL into the bundle.
# CI uses the repository secret VITE_CONVEX_URL when present; otherwise a
# placeholder is compiled in so the build still succeeds (the app will show
# a connection error until rebuilt with the real deployment URL).
#
# Windows runners ship with MSVC preinstalled; Tauri downloads WiX (MSI) and
# NSIS automatically. macOS builds are universal (Apple Silicon + Intel).

name: Desktop installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # required for creating the GitHub Release on tag push

jobs:
  web-checks:
    name: TypeScript + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: TypeScript check
        run: bunx tsc -b --noEmit

      - name: Unit tests
        run: bun test

  desktop:
    name: ${{ matrix.label }}
    needs: web-checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows (MSI + NSIS)
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            label: macOS (universal .app + .dmg)
            target: universal-apple-darwin

    runs-on: ${{ matrix.os }}
    env:
      VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL || 'https://placeholder.convex.cloud' }}
      # Windows code signing is opt-in. With no WINDOWS_CERTIFICATE secret the
      # build stays unsigned and SmartScreen warns - see README-WINDOWS.md.
      # Secrets cannot be used directly in `if:`, hence the job-level env.
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      WINDOWS_TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      # Regenerate Convex type bindings so the build never depends on stale
      # committed bindings or runner caches.
      - name: Generate Convex bindings
        run: bunx convex codegen --typecheck=disable

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Never empty: an empty value would make the action skip `rustup
          # target add` entirely, so each runner lists its own target.
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri.conf.json has no beforeBuildCommand, so the web bundle must be
      # built explicitly before tauri build (frontendDist: ../dist).
      - name: Web build (vite)
        run: bun run build

      - name: Build installers (macOS universal)
        if: matrix.target == 'universal-apple-darwin'
        run: bunx tauri build --target universal-apple-darwin

      # Base64 .pfx -> user certificate store, plus the Tauri signing override.
      - name: Import Windows signing certificate
        if: matrix.target != 'universal-apple-darwin' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          New-Item -ItemType directory -Path certificate -Force | Out-Null
          Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
          certutil -decode certificate/tempCert.txt certificate/certificate.pfx
          Remove-Item certificate/tempCert.txt
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $imported = Import-PfxCertificate -FilePath certificate/certificate.pfx `
            -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Write-Host "Imported certificate $($imported.Thumbprint)"
          $timestamp = $env:WINDOWS_TIMESTAMP_URL
          if (-not $timestamp) { $timestamp = "http://timestamp.digicert.com" }
          $config = @{ bundle = @{ windows = @{
            certificateThumbprint = $imported.Thumbprint
            digestAlgorithm = "sha256"
            timestampUrl = $timestamp
          } } } | ConvertTo-Json -Depth 6
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "src-tauri/tauri.signing.conf.json"), $config, $utf8)

      - name: Build installers (Windows, signed)
        if: matrix.target != 'universal-apple-darwin' && env.WINDOWS_CERTIFICATE != ''
        run: bunx tauri build --config src-tauri/tauri.signing.conf.json

      - name: Build installers (Windows, unsigned)
        if: matrix.target != 'universal-apple-darwin' && env.WINDOWS_CERTIFICATE == ''
        run: bunx tauri build

      - name: Verify Windows signatures
        if: matrix.target != 'universal-apple-darwin' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $installers = Get-ChildItem -Path src-tauri/target -Recurse -Include *.msi,*-setup.exe |
            Where-Object { $_.FullName -match "bundle\\(msi|nsis)\\" }
          if ($installers.Count -eq 0) { throw "No installers found to verify." }
          foreach ($installer in $installers) {
            $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
            Write-Host "$($installer.Name): $($signature.Status) - $($signature.SignerCertificate.Subject)"
            if ($signature.Status -eq "NotSigned") { throw "Not signed: $($installer.Name)" }
            if ($signature.Status -ne "Valid") {
              Write-Host "::warning::$($installer.Name) signed but the chain is not trusted: $($signature.Status)"
            }
          }

      - name: Upload artifacts (Windows)
        if: matrix.target != 'universal-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          # `**` covers both layouts: target/release/bundle and the
          # target-triple folder Tauri uses on some setups.
          path: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload artifacts (macOS)
        if: matrix.target == 'universal-apple-darwin'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/**/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/**/release/bundle/msi/*.msi
            src-tauri/target/**/release/bundle/nsis/*.exe
            src-tauri/target/**/release/bundle/dmg/*.dmg
          generate_release_notes: true
