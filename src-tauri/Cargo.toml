[package]
name = "rbuilder"
version = "0.1.10"
description = "RBUILDER — a local AI development workspace"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "rbuilder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = { version = "8.2.0", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
